name: Build and Deploy

on:
  push:
    branches:
      - main

# Nécessaires au dépôt sur GitHub Pages : l'action publie via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️. Installer Node.js (Angular 22 exige Node ^22.22.3, ^24.15.0 ou >=26)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3️. Installer les dépendances et builder
      - name: Install dependencies
        run: npm ci

      # `--base-href ./` rend tous les liens relatifs : la même archive sert
      # sur itch (`/html/<id>/`) comme sur Pages (`/aura-farmer/`).
      - name: Build Angular app
        run: npm run build -- --configuration production --base-href ./ --output-path=dist/aura-farmer

      # 4️. Lancer semantic-release (pour le changelog + tag + release)
      # - name: Generate changelog and release
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: npx semantic-release

      # 5. Installer Butler
      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/butler

      # 6. Déployer sur Itch.io
      # Le builder `application` range le site dans `browser/` : c'est ce
      # dossier qu'il faut pousser, pour qu'itch trouve `index.html` à la racine
      # de l'archive. Pousser `dist/aura-farmer` donnait une page blanche.
      - name: Deploy to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
          ITCH_USER: ${{ secrets.ITCH_USER }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
          ITCH_CHANNEL: ${{ secrets.ITCH_CHANNEL }}
        run: |
          echo "🚀 Deploying to itch.io..."
          echo "User: $ITCH_USER | Game: $ITCH_GAME | Channel: $ITCH_CHANNEL"
          test -f dist/aura-farmer/browser/index.html
          butler push "dist/aura-farmer/browser" "$ITCH_USER/$ITCH_GAME:$ITCH_CHANNEL"

      # 7. Préparer la même archive pour GitHub Pages
      # `.nojekyll` désactive Jekyll, qui ignorerait tout fichier ou dossier
      # commençant par un souligné.
      - name: Prepare GitHub Pages artifact
        run: touch dist/aura-farmer/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/aura-farmer/browser

  # Le dépôt sur Pages se fait dans un job à part : c'est ce qu'exige
  # `deploy-pages`, qui publie dans l'environnement `github-pages`. Il réutilise
  # l'archive du build, si bien qu'itch et Pages servent exactement les mêmes
  # fichiers.
  github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
