<div class="shop-map">
  <header class="bar">
    <button type="button" class="back" (click)="back()">&larr; {{ 'BACK' | translate }}</button>

    <p class="aura">
      {{ auraManager.auraCount() | formatAura }} <span>{{ 'AURA' | translate }}</span>
    </p>

    <div class="tools">
      <button type="button" class="tool wide" (click)="cycleBuyAmount()">
        {{ 'BUY' | translate }} {{ buyAmount() }}
      </button>
      <button type="button" class="tool" [attr.aria-label]="'ZOOM_OUT' | translate" (click)="zoomBy(1 / 1.25)">&minus;</button>
      <button type="button" class="tool" [attr.aria-label]="'ZOOM_IN' | translate" (click)="zoomBy(1.25)">+</button>
      <button type="button" class="tool wide" (click)="recenter()">{{ 'RECENTER' | translate }}</button>
    </div>
  </header>

  <div
    #viewport
    class="viewport"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
    (wheel)="onWheel($event)"
  >
    <div class="world" [style.transform]="transform()" [style.width.px]="world.width" [style.height.px]="world.height">
      <!-- Liens tracés sous les nœuds. -->
      <svg class="links" [attr.viewBox]="'0 0 ' + world.width + ' ' + world.height" aria-hidden="true">
        @for (node of nodes(); track node.key) {
          @if (node.parent) {
            <line
              [attr.x1]="node.parent.x"
              [attr.y1]="node.parent.y"
              [attr.x2]="node.x"
              [attr.y2]="node.y"
              [class.dim]="!isRevealed(node)"
            />
          }
        }
      </svg>

      @for (node of nodes(); track node.key) {
        <button
          type="button"
          [class]="'node kind-' + node.kind"
          [class.locked]="!isRevealed(node)"
          [class.owned]="isOwned(node)"
          [class.poor]="isRevealed(node) && !isOwned(node) && !affordable(node)"
          [style.left.px]="node.x"
          [style.top.px]="node.y"
          (click)="activate(node)"
        >
          @if (node.kind === 'root' || node.kind === 'category') {
            <img [src]="node.kind === 'root' ? moyaiIcon : buildingIcon" alt="" class="mark">
            <span class="name">{{ node.labelKey! | translate }}</span>
            @if (node.comingSoon) {
              <span class="cost soon">{{ 'SHOP_COMING_SOON' | translate }}</span>
            }
          } @else if (!isRevealed(node)) {
            <img [src]="questionIcon" alt="" class="mark">
            <span class="name">?????</span>
          } @else if (node.kind === 'item') {
            <img [src]="moyaiIcon" alt="" class="mark">
            <span class="name">{{ node.item!.name() }}</span>
            <span class="meta">
              {{ 'LEVEL' | translate }} {{ node.item!.level() | number:'1.0-0' }} / {{ node.item!.maxLevel }}
            </span>
            @if (isMaxed(node)) {
              <span class="cost maxed">{{ 'MAXED' | translate }}</span>
            } @else {
              <span class="cost">
                {{ price(node) | formatAura }}
                <small>{{ 'AURA' | translate }}</small>
              </span>
              <span class="meta">&times;{{ amountFor(node.item!) }}</span>
            }
          } @else {
            <img [src]="arrowIcon" alt="" class="mark">
            <span class="name">{{ node.upgrade!.name | translate }}</span>
            @if (isOwned(node)) {
              <span class="cost owned-label">{{ 'UNLOCKED' | translate }}</span>
            } @else {
              <span class="cost">
                {{ price(node) | formatAura }}
                <small>{{ 'AURA' | translate }}</small>
              </span>
            }
          }
        </button>
      }
    </div>

    <p class="progress">
      <span class="count">{{ progress().owned }}/{{ progress().total }}</span>
      <span class="caption">{{ 'SHOP_PROGRESS' | translate }}</span>
    </p>
  </div>
</div>
