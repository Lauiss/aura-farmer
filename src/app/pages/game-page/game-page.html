<div class="game-screen">
  <header class="counters">
    <p class="counter total">
      <span class="value">{{ auraManager.auraCount() | formatAura }}</span>
      <app-moyai-viewer
        class="aura-mark"
        [interactive]="false"
        [idleSpin]="0.9"
        [distance]="4.4"
        aria-hidden="true"
      ></app-moyai-viewer>
      <span class="unit">{{ 'AURA' | translate }}</span>
    </p>

    <p class="counter rate">
      <span class="value">{{ shopManager.getTotalValue() | formatAura }}</span>
      <app-moyai-viewer
        class="aura-mark small"
        [interactive]="false"
        [idleSpin]="0.9"
        [distance]="4.4"
        aria-hidden="true"
      ></app-moyai-viewer>
      <span class="unit">{{ 'AURA_PER_SECOND' | translate }}</span>
    </p>
  </header>

  <main class="stage">
    <!-- Manipulable comme sur l'écran titre, et immobile tant qu'on n'y
         touche pas : c'est le joueur qui l'oriente. -->
    <app-moyai-viewer
      #btn
      class="hero"
      [interactive]="true"
      [idleSpin]="0"
      [spinReporter]="reportSpin"
      [cosmetics]="wardrobeManager.equipped()"
      [distance]="heroDistance()"
      (clicked)="increment($event)"
    ></app-moyai-viewer>

    <app-combo-meter class="combo"></app-combo-meter>
  </main>

  <nav class="actions">
    <app-icon-btn [icon]="shopIcon" label="SHOP" (activate)="openShop()"></app-icon-btn>
    @if (wardrobeManager.hasAny()) {
      <app-icon-btn [icon]="hangerIcon" label="WARDROBE" (activate)="openWardrobe()"></app-icon-btn>
    }
    <app-icon-btn [icon]="trophyIcon" label="ACHIEVEMENTS" (activate)="openAchievements()"></app-icon-btn>
    <app-icon-btn [icon]="gearIcon" label="SETTINGS" (activate)="openSettings()"></app-icon-btn>
  </nav>
</div>
