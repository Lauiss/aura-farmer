<div class="game-screen">
  <header class="counters">
    <div class="counter total">
      <h2>{{ auraManager.auraCount() | formatAura }}</h2>
      <span class="unit">
        <app-moyai-viewer
          class="aura-mark"
          [interactive]="false"
          [idleSpin]="0.9"
          [distance]="4.4"
          aria-hidden="true"
        ></app-moyai-viewer>
        {{ 'AURA' | translate }}
      </span>
    </div>

    <div class="counter rate">
      <h3>{{ shopManager.getTotalValue() | formatAura }}</h3>
      <span class="unit">
        <app-moyai-viewer
          class="aura-mark small"
          [interactive]="false"
          [idleSpin]="0.9"
          [distance]="4.4"
          aria-hidden="true"
        ></app-moyai-viewer>
        {{ 'AURA_PER_SECOND' | translate }}
      </span>
    </div>
  </header>

  <main class="stage">
    <app-moyai-viewer
      #btn
      class="hero"
      [interactive]="false"
      [idleSpin]="0.3"
      (clicked)="increment($event)"
    ></app-moyai-viewer>
  </main>

  <nav class="actions">
    <app-icon-btn [icon]="shopIcon" label="SHOP" (activate)="openShop()"></app-icon-btn>
    <app-icon-btn [icon]="trophyIcon" label="ACHIEVEMENTS" (activate)="openAchievements()"></app-icon-btn>
    <app-icon-btn [icon]="gearIcon" label="SETTINGS" (activate)="openSettings()"></app-icon-btn>
  </nav>
</div>
