<div class="wardrobe">
  <h2>{{ 'WARDROBE' | translate }}</h2>

  @if (wardrobe.unlocked().length === 0) {
    <p class="empty">{{ 'WARDROBE_EMPTY' | translate }}</p>
  } @else {
    <ul class="pieces">
      @for (id of wardrobe.unlocked(); track id) {
        <li>
          <button
            type="button"
            class="piece"
            [class.worn]="wardrobe.isWorn(id)"
            [attr.aria-pressed]="wardrobe.isWorn(id)"
            (click)="toggle(id)"
          >
            <span class="name">{{ labelKey(id) | translate }}</span>
            <span class="state">
              {{ (wardrobe.isWorn(id) ? 'WARDROBE_WORN' : 'WARDROBE_STORED') | translate }}
            </span>
          </button>
        </li>
      }
    </ul>
  }

  @if (backgrounds.hasAny()) {
    <section class="scenery">
      <h3>{{ 'BACKGROUNDS' | translate }}</h3>
      <ul class="pieces">
        @for (id of backgrounds.owned(); track id) {
          <li>
            <button
              type="button"
              class="piece"
              [class.worn]="backgrounds.selected() === id"
              [attr.aria-pressed]="backgrounds.selected() === id"
              (click)="selectBackground(id)"
            >
              <span class="name">{{ backgroundKey(id) | translate }}</span>
              <span class="state">
                {{ (backgrounds.selected() === id ? 'WARDROBE_WORN' : 'WARDROBE_STORED') | translate }}
              </span>
            </button>
          </li>
        }
      </ul>
    </section>
  }
</div>
