
@for (entry of modalManager.entries(); track $index) {
  <div
    class="modal-backdrop"
    [style.z-index]="1000 + $index * 2"
    (click)="modalManager.close()"
  ></div>
  <div
    class="modal-content"
    [class]="'size-' + entry.size"
    [style.z-index]="1001 + $index * 2"
    (click)="$event.stopPropagation()"
  >
    <ng-container *ngComponentOutlet="entry.component"></ng-container>
  </div>
}
