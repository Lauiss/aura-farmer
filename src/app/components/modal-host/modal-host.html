
@if (modalManager.currentComponent()) {
  <div class="modal-backdrop" (click)="modalManager.close()"></div>
  <div class="modal-content" [class]="'size-' + modalManager.size()" (click)="$event.stopPropagation()">
    <ng-container *ngComponentOutlet="modalManager.currentComponent()!"></ng-container>
  </div>
}
