@if (art(); as art) {
  <!-- `slice` cadre le décor comme une photo : il est dessiné large, et c'est
       la hauteur qui se rogne en premier sur un écran étroit. -->
  <svg
    class="backdrop"
    [attr.viewBox]="viewBox"
    preserveAspectRatio="xMidYMid slice"
    aria-hidden="true"
    focusable="false"
  >
    <rect x="0" y="0" width="100" height="60" [attr.fill]="art.sky"></rect>

    <!-- L'astre se peint **avant** les plans : un SVG s'empile dans l'ordre du
         document, et placé après, le soleil du crépuscule passait devant les
         montagnes qu'il est censé éclairer par-derrière. -->
    @if (art.disc; as disc) {
      <circle [attr.cx]="disc.cx" [attr.cy]="disc.cy" [attr.r]="disc.r" [attr.fill]="disc.fill"></circle>
    }

    @for (layer of art.layers; track $index) {
      <polygon [attr.points]="layer.points" [attr.fill]="layer.fill" [attr.opacity]="layer.opacity"></polygon>
    }

    @for (set of art.dots; track $index) {
      @for (dot of set.positions; track $index) {
        @if (set.square) {
          <rect
            [attr.x]="dot[0]"
            [attr.y]="dot[1]"
            [attr.width]="set.radius * 2"
            [attr.height]="set.radius * 2.6"
            [attr.fill]="set.fill"
          ></rect>
        } @else {
          <circle [attr.cx]="dot[0]" [attr.cy]="dot[1]" [attr.r]="set.radius" [attr.fill]="set.fill"></circle>
        }
      }
    }
  </svg>
}
